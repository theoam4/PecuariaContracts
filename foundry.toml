[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[rpc_endpoints]
# Use environment variables for secrets; Foundry will resolve these names via --rpc-url
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${ALCHEMY_SEPOLIA_RPC_URL}"
optimism_sepolia = "${ALCHEMY_OPTIMISM_SEPOLIA_RPC_URL}"
arbitrum_one_sepolia = "${ALCHEMY_ARBITRUM_SEPOLIA_RPC_URL}"
polygon_amoy = "${ALCHEMY_AMOY_RPC_URL}"
anvil = "${ANVIL_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
